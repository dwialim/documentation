      status_amazone_cloud_watch_agent: assets/images/status-amazone-cloud-watch-agent.png
      metric_cwagent: assets/images/metric-cwagent.png
      metric_instanceid: assets/images/metric-instanceid.png
      create_widget_mem_used_percent: assets/images/create-widget-mem_used_percent.png

  links:
